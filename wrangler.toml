name = "work-manager"
main = "worker/index.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# 빌드된 SPA 정적 자산 — Worker에서 env.ASSETS로 서빙
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

# Browser Rendering — 발주서 PDF 서버 렌더(/api/render-pdf)에서 env.BROWSER로 사용
[browser]
binding = "BROWSER"
