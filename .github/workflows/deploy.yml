name: Deploy to Cloudflare Workers

# ⛔ 자동 배포를 껐다 (2026-09-11).
#
# 이 워크플로는 2026-09-10 과 2026-09-11 두 번, 「성공」이라고 하면서 사내 서버 설정이
# 빠진 결과물을 운영에 올렸다. 두 번 다 직원이 앱을 못 쓰는 사고가 됐다.
# 검사를 더 촘촘히 하는 것보다 «배포 길을 하나로» 줄이는 편이 확실하다.
#
# 배포는 이제 로컬에서만 한다:  npm run deploy
#   (scripts/deploy.mjs 가 만들기 전·올린 뒤 두 번 사내 서버 주소를 확인한다)
#
# 되살리려면 아래 workflow_dispatch 를 지우고 push 트리거를 되돌린다.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci

      # 사내 서버 설정 — 저장소에는 .env.production 을 두지 않는다(비밀값이라서).
      # 이 값이 빠진 채 배포되면 앱이 구글을 보게 되어 직원이 로그인조차 못 한다.
      # 그런 일이 실제로 있었으므로(2026-09-10), 값이 없으면 여기서 멈춘다.
      - name: 사내 서버 설정 확인
        env:
          VITE_BACKEND: ${{ secrets.VITE_BACKEND }}
          VITE_SB_URL: ${{ secrets.VITE_SB_URL }}
          VITE_SB_ANON_KEY: ${{ secrets.VITE_SB_ANON_KEY }}
        run: |
          if [ -z "$VITE_SB_URL" ] || [ -z "$VITE_SB_ANON_KEY" ] || [ -z "$VITE_BACKEND" ]; then
            echo "::error::사내 서버 설정(VITE_BACKEND · VITE_SB_URL · VITE_SB_ANON_KEY)이 없습니다. 저장소 비밀값을 넣어 주세요."
            exit 1
          fi
          printf 'VITE_BACKEND=%s\nVITE_SB_URL=%s\nVITE_SB_ANON_KEY=%s\n' "$VITE_BACKEND" "$VITE_SB_URL" "$VITE_SB_ANON_KEY" > .env.production
          echo "설정 준비 완료"

      - run: npm run build

      - name: 만든 결과물 확인
        env:
          VITE_SB_URL: ${{ secrets.VITE_SB_URL }}
        run: |
          MARK="${VITE_SB_URL#https://}"
          if ! grep -rql "$MARK" dist/assets; then
            echo "::error::만든 결과물에 사내 서버 주소($MARK)가 없습니다. 올리지 않고 멈춥니다."
            exit 1
          fi
          echo "결과물에 사내 서버 주소가 들어 있습니다"

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --name work-manager
